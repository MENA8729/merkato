
<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ዝርዝሮች</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root{
            --green:#1e7e4f;
            --green-dark:#145c39;
            --green-soft:#eaf7f0;

            --blue:#5367c9;
            --blue-soft:#eef1ff;

            --orange:#c47a16;
            --orange-soft:#fff4e3;

            --text:#25312b;
            --muted:#7d8982;
            --border:#e8eeeb;
            --background:#f6f8f7;
        }

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            min-height:100vh;
            font-family:'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background:var(--background);
            color:var(--text);
        }

        /* =================================
           PAGE
        ================================= */

        .page{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:30px 16px;
        }

        .menu-container{
            width:100%;
            max-width:1000px;
        }

        /* =================================
           CARDS
        ================================= */

        .menu-card{
            position:relative;
            display:flex;
            align-items:center;
            gap:17px;

            width:100%;
            min-height:105px;

            padding:20px;

            background:#fff;
            border:1px solid var(--border);
            border-radius:22px;

            text-decoration:none;
            color:var(--text);

            box-shadow:
                0 8px 25px rgba(24,55,40,.06);

            overflow:hidden;

            transition:
                transform .22s ease,
                box-shadow .22s ease,
                border-color .22s ease;
        }

        .menu-card:hover{
            transform:translateY(-5px);
            box-shadow:
                0 15px 35px rgba(24,55,40,.12);
        }

        .menu-card:active{
            transform:translateY(-1px) scale(.99);
        }

        /* Decorative circle */

        .menu-card::before{
            content:"";
            position:absolute;
            width:150px;
            height:150px;
            right:-65px;
            top:-70px;
            border-radius:50%;
            pointer-events:none;
        }

        /* =================================
           ICON
        ================================= */

        .menu-icon{
            width:62px;
            height:62px;

            flex:0 0 62px;

            display:flex;
            align-items:center;
            justify-content:center;

            border-radius:18px;

            font-size:1.5rem;

            position:relative;
            z-index:1;
        }

        /* Products */

        .products-card .menu-icon{
            background:var(--green-soft);
            color:var(--green);
        }

        .products-card::before{
            background:#dff2e7;
        }

        /* Customers */

        .customers-card .menu-icon{
            background:var(--blue-soft);
            color:var(--blue);
        }

        .customers-card::before{
            background:#e3e7ff;
        }

        /* Suppliers */

        .suppliers-card .menu-icon{
            background:var(--orange-soft);
            color:var(--orange);
        }

        .suppliers-card::before{
            background:#ffecd0;
        }

        /* =================================
           TEXT
        ================================= */

        .menu-content{
            flex:1;
            min-width:0;
            position:relative;
            z-index:1;
        }

        .menu-content h4{
            margin:0;
            font-size:1.12rem;
            font-weight:800;
            line-height:1.3;
        }

        .menu-content p{
            margin:5px 0 0;
            color:var(--muted);
            font-size:.82rem;
            line-height:1.4;
        }

        /* =================================
           ARROW
        ================================= */

        .menu-arrow{
            width:40px;
            height:40px;

            flex:0 0 40px;

            display:flex;
            align-items:center;
            justify-content:center;

            background:#f5f7f6;
            color:#7b8780;

            border-radius:12px;

            font-size:.95rem;

            position:relative;
            z-index:1;

            transition:
                transform .2s ease,
                background .2s ease,
                color .2s ease;
        }

        .menu-card:hover .menu-arrow{
            transform:translateX(4px);
        }

        .products-card:hover .menu-arrow{
            background:var(--green-soft);
            color:var(--green);
        }

        .customers-card:hover .menu-arrow{
            background:var(--blue-soft);
            color:var(--blue);
        }

        .suppliers-card:hover .menu-arrow{
            background:var(--orange-soft);
            color:var(--orange);
        }

        /* =================================
           MOBILE
        ================================= */

        @media(max-width:767px){

            .page{
                padding:20px 12px;
            }

            .menu-container{
                max-width:520px;
            }

            .row{
                --bs-gutter-y:12px;
            }

            .menu-card{
                min-height:88px;
                padding:14px;
                gap:12px;
                border-radius:18px;
            }

            .menu-icon{
                width:50px;
                height:50px;
                flex-basis:50px;
                border-radius:15px;
                font-size:1.2rem;
            }

            .menu-content h4{
                font-size:.95rem;
            }

            .menu-content p{
                font-size:.72rem;
                margin-top:3px;
            }

            .menu-arrow{
                width:34px;
                height:34px;
                flex-basis:34px;
                border-radius:10px;
                font-size:.8rem;
            }
        }

        /* =================================
           VERY SMALL PHONES
        ================================= */

        @media(max-width:380px){

            .page{
                padding:15px 10px;
            }

            .menu-card{
                min-height:80px;
                padding:11px;
            }

            .menu-icon{
                width:44px;
                height:44px;
                flex-basis:44px;
                border-radius:13px;
                font-size:1.05rem;
            }

            .menu-content h4{
                font-size:.88rem;
            }

            .menu-content p{
                font-size:.67rem;
            }

            .menu-arrow{
                width:30px;
                height:30px;
                flex-basis:30px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="menu-container">

        <div class="row g-3">

            <!-- =========================
                 PRODUCTS
            ========================== -->

            <div class="col-12 col-md-4">

                <a href="{{ url_for('products_page') }}"
                   class="menu-card products-card">

                    <div class="menu-icon">
                        <i class="bi bi-box-seam-fill"></i>
                    </div>

                    <div class="menu-content">
                        <h4>ዕቃዎች</h4>
                        <p>የዕቃዎች ዝርዝር</p>
                    </div>

                    <div class="menu-arrow">
                        <i class="bi bi-chevron-right"></i>
                    </div>

                </a>

            </div>


            <!-- =========================
                 CUSTOMERS
            ========================== -->

            <div class="col-12 col-md-4">

                <a href="{{ url_for('customers_page') }}"
                   class="menu-card customers-card">

                    <div class="menu-icon">
                        <i class="bi bi-people-fill"></i>
                    </div>

                    <div class="menu-content">
                        <h4>ደንበኞች</h4>
                        <p>የደንበኞች ዝርዝር</p>
                    </div>

                    <div class="menu-arrow">
                        <i class="bi bi-chevron-right"></i>
                    </div>

                </a>

            </div>


            <!-- =========================
                 SUPPLIERS
            ========================== -->

            <div class="col-12 col-md-4">

                <a href="{{ url_for('suppliers_page') }}"
                   class="menu-card suppliers-card">

                    <div class="menu-icon">
                        <i class="bi bi-truck-front-fill"></i>
                    </div>

                    <div class="menu-content">
                        <h4>አቅራቢዎች</h4>
                        <p>የአቅራቢዎች ዝርዝር</p>
                    </div>

                    <div class="menu-arrow">
                        <i class="bi bi-chevron-right"></i>
                    </div>

                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
