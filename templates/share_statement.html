<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Statement</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
    body{
        font-family:'Segoe UI', sans-serif;
        background:#f4f6f8;
        display:flex;
        align-items:center;
        justify-content:center;
        min-height:100vh;
        margin:0;
    }
    .share-card{
        background:#fff;
        border-radius:18px;
        padding:30px;
        box-shadow:0 10px 30px rgba(0,0,0,0.1);
        max-width:380px;
        width:90%;
        text-align:center;
    }
    .share-card h5{ font-weight:700; margin-bottom:6px; }
    .share-card p{ color:#64748b; font-size:0.88rem; margin-bottom:22px; }
    .share-btn{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        width:100%;
        padding:12px;
        border-radius:12px;
        font-weight:600;
        margin-bottom:10px;
        border:none;
        text-decoration:none;
        color:#fff;
    }
    .share-telegram{ background:#229ed9; }
    .share-facebook{ background:#1877f2; }
    .share-cancel{ background:#f1f3f5; color:#495057; }
</style>
</head>
<body>

<div class="share-card">
    <h5>Share Customer Statement</h5>
    <p>Statement for {{ customer.name }}</p>

    <a class="share-btn share-telegram"
       href="https://t.me/share/url?url={{ pdf_url | urlencode }}&text=Customer%20Debt%20Statement%20-%20{{ customer.name | urlencode }}"
       target="_blank">
        <i class="bi bi-send"></i> Share on Telegram
    </a>

    <a class="share-btn share-facebook"
       href="https://www.facebook.com/sharer/sharer.php?u={{ pdf_url | urlencode }}"
       target="_blank">
        <i class="bi bi-facebook"></i> Share on Facebook
    </a>

    <button type="button" class="share-btn share-cancel" onclick="window.close(); history.back();">
        Cancel
    </button>
</div>

</body>
</html>
