<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Statement</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    body{
        font-family:'Segoe UI', sans-serif;
        background:#f4f6f8;
        display:flex;
        align-items:center;
        justify-content:center;
        min-height:100vh;
        margin:0;
    }

    .share-card{
        background:#fff;
        border-radius:18px;
        padding:30px;
        box-shadow:0 10px 30px rgba(0,0,0,0.1);
        max-width:380px;
        width:90%;
        text-align:center;
    }

    .share-card h5{
        font-weight:700;
        margin-bottom:6px;
    }

    .share-card p{
        color:#64748b;
        font-size:0.88rem;
        margin-bottom:22px;
    }

    .share-btn{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        width:100%;
        padding:12px;
        border-radius:12px;
        font-weight:600;
        margin-bottom:10px;
        border:none;
        text-decoration:none;
        color:#fff;
        cursor:pointer;
    }

    .share-btn:disabled{
        opacity:0.6;
        cursor:not-allowed;
    }

    .share-telegram{
        background:#229ed9;
    }

    .share-facebook{
        background:#1877f2;
    }

    .share-cancel{
        background:#f1f3f5;
        color:#495057;
    }
</style>
</head>

<body>

<div class="share-card">

    <h5>Share Customer Statement</h5>

    <p>Statement for {{ customer.name }}</p>

    <button type="button"
            class="share-btn share-telegram"
            onclick="sharePDF(this)">
        <i class="bi bi-send"></i> Share on Telegram
    </button>

    <button type="button"
            class="share-btn share-facebook"
            onclick="sharePDF(this)">
        <i class="bi bi-facebook"></i> Share on Facebook
    </button>

    <button type="button"
            class="share-btn share-cancel"
            onclick="window.close(); history.back();">
        Cancel
    </button>

</div>

<script>
async function sharePDF(button) {
    button.disabled = true;
    const originalHTML = button.innerHTML;
    button.innerHTML = "<i class=\"bi bi-hourglass-split\"></i> Preparing...";

    try {
        const url = "{{ pdf_url }}" + "?t=" + Date.now();

        const response = await fetch(url, {
            cache: "no-store"
        });

        if (!response.ok) {
            console.error("Server error:", response.status);
            alert("Could not generate the statement. Server error: " + response.status);
            return;
        }

        const contentType = response.headers.get("content-type");

        if (!contentType || !contentType.includes("application/pdf")) {
            console.error("Expected PDF but received:", contentType);
            alert("Could not generate the statement because the server did not return a PDF.");
            return;
        }

        const blob = await response.blob();

        if (blob.size === 0) {
            alert("Could not generate the statement. The file was empty.");
            return;
        }

        const file = new File(
            [blob],
            "Customer_Statement_{{ customer.id }}.pdf",
            {
                type: "application/pdf"
            }
        );

        if (
            navigator.canShare &&
            navigator.canShare({ files: [file] })
        ) {
            await navigator.share({
                title: "Customer Debt Statement",
                text: "Customer Debt Statement - {{ customer.name }}",
                files: [file]
            });
        } else {
            const pdfFileURL = URL.createObjectURL(blob);
            window.open(pdfFileURL, "_blank");
        }

    } catch (error) {
        if (error.name === "AbortError") {
            // User closed the native share sheet without picking anything — not a real error
            console.log("Share cancelled by user.");
        } else {
            console.error("PDF error:", error);
            alert("Could not generate the statement.");
        }
    } finally {
        button.disabled = false;
        button.innerHTML = originalHTML;
    }
}
</script>

</body>
</html>
