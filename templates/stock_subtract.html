<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ከስቶክ ላይ ቀንስ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#16a34a;--red:#dc2626;--dark:#1e293b;--muted:#64748b;--bg:#f4f6f8;}
*{box-sizing:border-box;} html,body{overflow-x:hidden;max-width:100%;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--dark);}
.top-header{background:var(--green);color:#fff;display:flex;align-items:center;gap:14px;padding:16px 18px;position:sticky;top:0;z-index:10;}
.top-header .icon-btn{background:none;border:none;color:#fff;font-size:1.35rem;padding:0;}
.top-header h1{font-size:1.1rem;font-weight:700;margin:0;}
.form-wrap{padding:22px 18px 40px;max-width:480px;margin:0 auto;}
.form-card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 14px rgba(0,0,0,.05);}
.form-label{font-weight:600;font-size:.9rem;}
.btn-red{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;border-radius:10px;padding:12px;}
.btn-red:hover{background:#b91c1c;color:#fff;}
.flash-message{font-size:13px;font-weight:500;padding:8px 12px;margin:10px auto;max-width:480px;border-radius:7px;}
</style>
</head>
<body>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-success alert-dismissible fade show flash-message" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    {% endif %}
{% endwith %}

<div class="top-header">
    <a href="{{ url_for('new_action') }}" class="icon-btn"><i class="bi bi-arrow-right"></i></a>
    <h1>ከስቶክ ላይ ቀንስ</h1>
</div>

<div class="form-wrap">
    <div class="form-card">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">ምርት ይምረጡ</label>
                <select name="product_id" class="form-select" required>
                    <option value="" disabled selected>-- ምርት ይምረጡ --</option>
                    {% for product in products %}
                    <option value="{{ product.id }}">{{ product.name }} (አሁን፡ {{ product.current_quantity }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">የሚቀነስ መጠን</label>
                <input type="number" step="0.01" min="0.01" name="quantity" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-red w-100"><i class="bi bi-dash-lg me-1"></i>ቀንስ</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
