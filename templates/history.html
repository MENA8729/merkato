
<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ታሪክ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root{
            --green:#1e7e4f;
            --green-soft:#eaf7f0;
            --blue:#5367c9;
            --blue-soft:#eef1ff;
            --text:#25312b;
            --muted:#7d8982;
            --border:#e8eeeb;
        }

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            min-height:100vh;
            background:#f6f8f7;
            font-family:'Segoe UI', system-ui, sans-serif;
        }

        .page{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }

        .history-container{
            width:100%;
            max-width:600px;
        }

        .history-card{
            display:flex;
            align-items:center;
            gap:15px;
            width:100%;
            min-height:92px;
            padding:16px 18px;
            background:#fff;
            border:1px solid var(--border);
            border-radius:20px;
            text-decoration:none;
            color:var(--text);
            box-shadow:0 7px 24px rgba(25,60,43,.06);
            transition:.22s ease;
        }

        .history-card:hover{
            transform:translateY(-4px);
            box-shadow:0 13px 30px rgba(25,60,43,.11);
        }

        .history-icon{
            width:54px;
            height:54px;
            flex:0 0 54px;
            border-radius:16px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:1.35rem;
        }

        .sales .history-icon{
            background:var(--green-soft);
            color:var(--green);
        }

        .purchases .history-icon{
            background:var(--blue-soft);
            color:var(--blue);
        }

        .history-text{
            flex:1;
            min-width:0;
        }

        .history-text h5{
            margin:0;
            font-size:1rem;
            font-weight:800;
        }

        .history-text p{
            margin:4px 0 0;
            color:var(--muted);
            font-size:.76rem;
        }

        .arrow{
            width:34px;
            height:34px;
            border-radius:10px;
            background:#f5f7f6;
            color:#7c8982;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-shrink:0;
        }

        .history-card:hover .arrow{
            transform:translateX(3px);
        }

        @media(max-width:576px){

            .page{
                padding:15px 12px;
            }

            .history-card{
                min-height:78px;
                padding:12px;
                border-radius:17px;
                gap:11px;
            }

            .history-icon{
                width:45px;
                height:45px;
                flex-basis:45px;
                border-radius:13px;
                font-size:1.1rem;
            }

            .history-text h5{
                font-size:.88rem;
            }

            .history-text p{
                font-size:.68rem;
                margin-top:3px;
            }

            .arrow{
                width:30px;
                height:30px;
                border-radius:9px;
                font-size:.75rem;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="history-container">

        <div class="d-flex flex-column gap-3">

            <!-- Sales History -->
            <a href="{{ url_for('sales_history_page') }}"
               class="history-card sales">

                <div class="history-icon">
                    <i class="bi bi-cart-check-fill"></i>
                </div>

                <div class="history-text">
                    <h5>የሽያጭ ታሪክ</h5>
                    <p>የተከናወኑ ሽያጮችን ይመልከቱ</p>
                </div>

                <div class="arrow">
                    <i class="bi bi-chevron-right"></i>
                </div>

            </a>


            <!-- Purchase History -->
            <a href="{{ url_for('purchases_history_page') }}"
               class="history-card purchases">

                <div class="history-icon">
                    <i class="bi bi-bag-check-fill"></i>
                </div>

                <div class="history-text">
                    <h5>የግዢ ታሪክ</h5>
                    <p>የተከናወኑ ግዢዎችን ይመልከቱ</p>
                </div>

                <div class="arrow">
                    <i class="bi bi-chevron-right"></i>
                </div>

            </a>

        </div>

    </div>

</div>

</body>
</html>
