<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>አዲስ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#16a34a;--dark:#1e293b;--muted:#64748b;--bg:#f4f6f8;}
*{box-sizing:border-box;} html,body{overflow-x:hidden;max-width:100%;margin:0;}
body{font-family:'Inter',sans-serif;background:#fff;color:var(--dark);padding-bottom:76px;}

/* ---- Top header ---- */
.top-header{background:var(--green);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;position:sticky;top:0;z-index:10;}
.top-header .icon-btn{background:none;border:none;color:#fff;font-size:1.35rem;padding:0;line-height:1;}
.top-header h1{font-size:1.15rem;font-weight:700;margin:0;}

/* ---- Action grid ---- */
.action-wrap{padding:36px 18px 20px;}
.action-grid{display:grid;grid-template-columns:repeat(3,1fr);row-gap:34px;column-gap:10px;}
.action-item{display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;gap:10px;}
.action-circle{width:64px;height:64px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6rem;box-shadow:0 6px 14px rgba(22,163,74,.25);}
.action-label{font-size:.82rem;font-weight:600;color:var(--dark);line-height:1.3;}
.action-sub{font-size:.7rem;color:#93c5a8;font-weight:600;}

/* ---- Bottom nav ---- */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;padding:10px 0 14px;z-index:20;}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600;}
.bottom-nav a.active{color:var(--green);}
.bottom-nav .nav-icon{font-size:1.3rem;}
</style>
</head>
<body>

<div class="top-header">

    <h1>አዲስ</h1>

</div>

<div class="action-wrap">
    <div class="action-grid">
        <a href="{{ url_for('Selling') }}" class="action-item">
            <span class="action-circle"><i class="bi bi-cash-coin"></i></span>
            <span class="action-label">አዲስ ሽያጭ</span>
        </a>
        <a href="{{ url_for('purchases') }}" class="action-item">
            <span class="action-circle"><i class="bi bi-bag"></i></span>
            <span class="action-label">አዲስ ግዢ</span>
        </a>
        <a href="{{ url_for('customer_detail') }}" class="action-item">
            <span class="action-circle"><i class="bi bi-people"></i></span>
            <span class="action-label">ከደንበኛ ክፍያ ተቀበል</span>
        </a>

        <a href="{{ url_for('detail') }}" class="action-item">
            <span class="action-circle"><i class="bi bi-arrow-left-right"></i></span>
            <span class="action-label">ለአቅራቢ ክፍያ ፈፅም</span>
        </a>
        <a href="{{ url_for('suppliers_customers') }}" class="action-item">
            <span class="action-circle"><i class="bi bi-person-plus"></i></span>
            <span class="action-label">አዲስ ደንበኛ/አቅራቢ</span>
        </a>
        <a href="{{ url_for('inventory') }}" class="action-item">
            <span class="action-circle"><i class="bi bi-box-seam"></i></span>
            <span class="action-label">አዲስ እቃ</span>
        </a>

        <a href="{{ url_for('stock_add') }}" class="action-item">
    <span class="action-circle"><i class="bi bi-box-fill"></i></span>
    <span class="action-label">ወደ ስቶክ ጨምር</span>
</a>
<a href="{{ url_for('stock_subtract') }}" class="action-item">
    <span class="action-circle"><i class="bi bi-box2"></i></span>
    <span class="action-label">ከስቶክ ላይ ቀንስ</span>
</a>
<a href="{{ url_for('change_price') }}" class="action-item">
    <span class="action-circle"><i class="bi bi-tag"></i></span>
    <span class="action-label">የመሸጫ ዋጋ ቀይር</span>
</a>
    </div>
</div>

<nav class="bottom-nav">
    <a href="{{ url_for('home') }}">
        <span class="nav-icon"><i class="bi bi-grid"></i></span>
        <span>መነሻ</span>
    </a>
    <a href="#" class="active">
        <span class="nav-icon"><i class="bi bi-plus-circle-fill"></i></span>
        <span>አዲስ</span>
    </a>
    <a href="{{ url_for('products_page') }}">
        <span class="nav-icon"><i class="bi bi-basket"></i></span>
        <span>እቃዎች</span>
    </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
