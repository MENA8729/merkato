
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>የግዢ ዋጋ ቀይር</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#ea580c;--green:#16a34a;--red:#dc2626;--dark:#1e293b;--muted:#64748b;--bg:#f4f6f8;}
*{box-sizing:border-box;} html,body{overflow-x:hidden;max-width:100%;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--dark);}

.top-header{background:var(--orange);color:#fff;display:flex;align-items:center;gap:14px;padding:16px 18px;position:sticky;top:0;z-index:10;}
.top-header .icon-btn{background:none;border:none;color:#fff;font-size:1.35rem;padding:0;}
.top-header h1{font-size:1.1rem;font-weight:700;margin:0;}

.form-wrap{padding:18px 18px 190px;max-width:520px;margin:0 auto;}

.dropdown-wrap{position:relative;}
.picker-trigger{width:100%;background:var(--orange);color:#fff;border:none;border-radius:12px;padding:12px 16px;font-weight:700;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}
.picker-trigger:hover{background:#c2410c;}

.inline-dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;background:#fff;border:1px solid #dee2e6;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.12);max-height:320px;display:flex;flex-direction:column;overflow:hidden;}
.dropdown-search{padding:10px;position:relative;border-bottom:1px solid #f1f5f9;flex-shrink:0;}
.dropdown-search i{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:.8rem;}
.dropdown-search input{width:100%;padding:8px 10px 8px 30px;border:1px solid #dee2e6;border-radius:8px;font-size:.88rem;}
.dropdown-search input:focus{outline:none;border-color:var(--orange);}
.dropdown-list{overflow-y:auto;flex:1;}
.dropdown-option{padding:11px 14px;cursor:pointer;font-size:.88rem;display:flex;justify-content:space-between;align-items:center;}
.dropdown-option:hover{background:#f8fafc;}
.dropdown-option .opt-name{font-weight:600;color:var(--dark);}
.dropdown-option .opt-current{font-size:.76rem;font-weight:700;color:var(--muted);}
.dropdown-option.disabled{opacity:.4;pointer-events:none;}
.dropdown-empty{padding:16px;text-align:center;color:var(--muted);font-size:.82rem;}

.item-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;margin-bottom:14px;padding:14px 16px;box-shadow:0 3px 10px rgba(0,0,0,.04);}
.item-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.item-name{font-weight:700;font-size:.95rem;color:var(--dark);}
.item-delete{background:none;border:none;color:var(--red);font-size:1rem;padding:0;}
.item-current-price{font-size:.78rem;color:var(--muted);margin-bottom:8px;}
.item-current-price strong{color:var(--dark);}
.new-price-label{font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:4px;display:block;}
.new-price-input{height:42px;font-size:.92rem;border-radius:9px;border:1.3px solid #dee2e6;padding:8px 12px;width:100%;}
.new-price-input:focus{border-color:var(--orange);outline:none;}
.new-price-input.invalid{border-color:var(--red);background:#fff5f5;}

.empty-hint{text-align:center;color:var(--muted);font-size:.85rem;padding:30px 10px;}

.sticky-footer{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -4px 16px rgba(0,0,0,.08);z-index:80;}
.sticky-footer-inner{max-width:520px;margin:0 auto;padding:12px 18px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.sticky-count{font-size:.8rem;color:var(--muted);font-weight:600;}
.sticky-count strong{color:var(--dark);}
.btn-save-all{background:var(--orange);color:#fff;border:none;border-radius:10px;font-weight:700;padding:10px 22px;font-size:.88rem;}
.btn-save-all:hover{background:#c2410c;color:#fff;}

.flash-message{font-size:13px;font-weight:500;padding:8px 12px;margin:10px auto;max-width:520px;border-radius:7px;}
</style>
</head>
<body>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-success alert-dismissible fade show flash-message" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    {% endif %}
{% endwith %}

<div class="top-header">
    <a href="{{ url_for('new_action') }}" class="icon-btn"><i class="bi bi-arrow-right"></i></a>
    <h1>የግዢ ዋጋ ቀይር</h1>
</div>

<div class="form-wrap">
    <form method="POST" id="priceForm">
        <div id="realFieldsContainer" style="display:none;"></div>

        <div class="dropdown-wrap mb-3">
            <button type="button" class="picker-trigger" id="addProductBtn"><i class="bi bi-plus-lg"></i>ምርት ጨምር</button>
        </div>

        <div id="itemsContainer"></div>
        <div class="empty-hint" id="emptyHint">ገና ምንም ምርት አልተመረጠም። ከላይ ያለውን ቁልፍ ይጫኑ።</div>
    </form>
</div>

<div class="sticky-footer">
    <div class="sticky-footer-inner">
        <span class="sticky-count"><strong id="selectedCount">0</strong> ምርቶች ተመርጠዋል</span>
        <button type="submit" form="priceForm" class="btn-save-all"><i class="bi bi-check-circle me-1"></i>ሁሉንም አስቀምጥ</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const productsData = {
    {% for product in products %}
    "{{ product.id }}": { name: {{ product.name|tojson }}, currentPrice: {{ (product.purchase_price or 0)|tojson }} }{% if not loop.last %},{% endif %}
    {% endfor %}
};

const addProductBtn = document.getElementById('addProductBtn');
const itemsContainer = document.getElementById('itemsContainer');
const emptyHint = document.getElementById('emptyHint');
const selectedCountEl = document.getElementById('selectedCount');
const priceForm = document.getElementById('priceForm');
const realFieldsContainer = document.getElementById('realFieldsContainer');

function getNumber(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function formatMoney(v){ return getNumber(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ETB'; }

function getSelectedProductIds(excludeCard){
    const ids = [];
    itemsContainer.querySelectorAll('.item-card').forEach(card => {
        if(card === excludeCard) return;
        if(card.dataset.productId) ids.push(card.dataset.productId);
    });
    return ids;
}

function updateCount(){
    const count = itemsContainer.querySelectorAll('.item-card').length;
    selectedCountEl.textContent = count;
    emptyHint.style.display = count === 0 ? 'block' : 'none';
}

function closeAllDropdowns(){
    document.querySelectorAll('.inline-dropdown').forEach(p => {
        if(p._outsideHandler) document.removeEventListener('click', p._outsideHandler);
        p.remove();
    });
}

function openProductDropdown(triggerWrap, excludeCard, onSelect){
    closeAllDropdowns();

    const alreadySelected = getSelectedProductIds(excludeCard);

    const panel = document.createElement('div');
    panel.className = 'inline-dropdown';
    panel.innerHTML = `
        <div class="dropdown-search"><i class="bi bi-search"></i><input type="text" placeholder="ምርት ይፈልጉ..."></div>
        <div class="dropdown-list"></div>
        <div class="dropdown-empty" style="display:none;">ምንም አልተገኘም።</div>
    `;
    triggerWrap.appendChild(panel);

    const listEl = panel.querySelector('.dropdown-list');
    const searchInput = panel.querySelector('.dropdown-search input');
    const emptyEl = panel.querySelector('.dropdown-empty');

    function renderList(filter=''){
        listEl.innerHTML = '';
        let any = false;
        Object.entries(productsData).forEach(([id, p]) => {
            if(filter && !p.name.toLowerCase().includes(filter)) return;
            any = true;
            const isUsed = alreadySelected.includes(id);
            const row = document.createElement('div');
            row.className = 'dropdown-option' + (isUsed ? ' disabled' : '');
            row.innerHTML = `<span class="opt-name">${p.name}</span><span class="opt-current">አሁን: ${formatMoney(p.currentPrice)}</span>`;
            if(!isUsed){
                row.addEventListener('click', () => { onSelect(id, p.name, p.currentPrice); closeAllDropdowns(); });
            }
            listEl.appendChild(row);
        });
        emptyEl.style.display = any ? 'none' : 'block';
    }
    renderList();
    searchInput.addEventListener('input', () => renderList(searchInput.value.toLowerCase().trim()));
    setTimeout(() => searchInput.focus(), 30);

    function outsideHandler(e){
        if(!panel.contains(e.target) && !triggerWrap.contains(e.target)){
            closeAllDropdowns();
        }
    }
    panel._outsideHandler = outsideHandler;
    setTimeout(() => document.addEventListener('click', outsideHandler), 0);
}

function createItemCard(){
    const card = document.createElement('div');
    card.className = 'item-card';
    card.dataset.productId = '';
    card.innerHTML = `
        <div class="item-card-top">
            <span class="item-name">ምርት ይምረጡ...</span>
            <button type="button" class="item-delete"><i class="bi bi-trash"></i></button>
        </div>
        <div class="item-current-price" style="display:none;">የአሁኑ ዋጋ: <strong class="current-price-value"></strong></div>
        <label class="new-price-label">አዲስ ዋጋ</label>
        <input type="number" class="new-price-input" min="0" step="0.01" placeholder="0.00">
    `;
    return card;
}

function initItemCard(card){
    const nameEl = card.querySelector('.item-name');
    const deleteBtn = card.querySelector('.item-delete');
    const currentPriceWrap = card.querySelector('.item-current-price');
    const currentPriceValue = card.querySelector('.current-price-value');
    const priceInput = card.querySelector('.new-price-input');

    nameEl.addEventListener('click', () => {
        card.querySelector('.item-card-top').style.position = 'relative';
        openProductDropdown(card.querySelector('.item-card-top'), card, (id, name, currentPrice) => {
            card.dataset.productId = id;
            card.dataset.productName = name;
            nameEl.textContent = name;
            currentPriceWrap.style.display = 'block';
            currentPriceValue.textContent = formatMoney(currentPrice);
            priceInput.value = '';
            priceInput.focus();
        });
    });

    deleteBtn.addEventListener('click', () => {
        card.remove();
        updateCount();
    });

    priceInput.addEventListener('input', () => {
        priceInput.classList.toggle('invalid', priceInput.value !== '' && getNumber(priceInput.value) <= 0);
    });
}

addProductBtn.addEventListener('click', () => {
    const card = createItemCard();
    itemsContainer.appendChild(card);
    initItemCard(card);
    updateCount();
    card.querySelector('.item-name').click();
});

priceForm.addEventListener('submit', function(e){
    realFieldsContainer.innerHTML = '';

    const cards = Array.from(itemsContainer.querySelectorAll('.item-card'));

    if(cards.length === 0){
        e.preventDefault();
        alert('እባክዎ ቢያንስ አንድ ምርት ይምረጡ።');
        return;
    }

    let hasInvalid = false;
    cards.forEach(card => {
        const priceInput = card.querySelector('.new-price-input');
        const price = getNumber(priceInput.value);
        if(!card.dataset.productId || priceInput.value === '' || price <= 0){
            hasInvalid = true;
        }
    });

    if(hasInvalid){
        e.preventDefault();
        alert('እባክዎ ለሁሉም ምርቶች ትክክለኛ አዲስ ዋጋ ያስገቡ (ከዜሮ በላይ)።');
        return;
    }

    cards.forEach((card, i) => {
        const createHidden = (suffix, val) => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = `items-${i}-${suffix}`;
            input.value = val;
            realFieldsContainer.appendChild(input);
        };
        createHidden('product_id', card.dataset.productId);
        createHidden('new_price', card.querySelector('.new-price-input').value);
    });
});

updateCount();
</script>
</body>
</html>
