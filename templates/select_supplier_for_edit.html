<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>አቅራቢ ይምረጡ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2563eb;--dark:#1e293b;--muted:#64748b;--bg:#f4f6f8;}
*{box-sizing:border-box;} html,body{overflow-x:hidden;max-width:100%;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--dark);}
.navbar{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:14px 0;}
.navbar-brand{font-weight:800;color:var(--blue)!important;font-size:1.3rem;}
.navbar-brand i{margin-right:6px;}
.hero{background:linear-gradient(135deg,#1e3a5f,#2563eb);color:#fff;padding:32px 0 44px;text-align:center;}
.hero h1{font-weight:800;font-size:1.5rem;margin-bottom:4px;}
.hero p{color:#dbeafe;font-size:.9rem;margin:0;}

.filter-wrap{margin-top:-24px;}
.filter-bar{background:#fff;border-radius:14px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.07);}
.filter-bar input{border:none;padding:10px 14px;font-size:.95rem;width:100%;border-radius:10px;}
.filter-bar input:focus{outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.12);}

.contact-list{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.05);overflow:hidden;margin-top:20px;}
.contact-row{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #eef1f4;text-decoration:none;color:var(--dark);transition:background .15s ease;}
.contact-row:last-child{border-bottom:none;}
.contact-row:hover{background:#f8fafc;color:var(--dark);}
.contact-avatar{width:42px;height:42px;min-width:42px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;}
.contact-info{flex:1;min-width:0;}
.contact-name{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.contact-sub{font-size:.78rem;color:var(--muted);}
.contact-arrow{color:var(--muted);font-size:1.1rem;}

.empty-state{text-align:center;padding:50px 20px;background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.05);margin-top:20px;}
.empty-state i{font-size:2.6rem;color:#cbd5e1;margin-bottom:14px;}
</style>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}"><i class="bi bi-boxes"></i>StockManager</a>
    </div>
</nav>

<section class="hero">
    <div class="container">
        <h1>አቅራቢ ይምረጡ</h1>
        <p>ግዢ ለማስተካከል የአቅራቢውን ስም ይምረጡ</p>
    </div>
</section>

<div class="container filter-wrap">
    <div class="filter-bar">
        <input type="text" id="supplierSearch" placeholder="አቅራቢ ይፈልጉ...">
    </div>

    {% if suppliers %}
    <div class="contact-list" id="supplierList">
        {% for supplier in suppliers %}
        <a href="{{ url_for('supplier_purchase_history', supplier_id=supplier.id) }}"
           class="contact-row"
           data-search="{{ supplier.name|lower }} {{ supplier.phone|lower if supplier.phone else '' }}">
            <div class="contact-avatar">{{ supplier.name[0]|upper }}</div>
            <div class="contact-info">
                <div class="contact-name">{{ supplier.name }}</div>
                {% if supplier.phone %}<div class="contact-sub">{{ supplier.phone }}</div>{% endif %}
            </div>
            <i class="bi bi-chevron-left contact-arrow"></i>
        </a>
        {% endfor %}
    </div>
    {% else %}
    <div class="empty-state"><i class="bi bi-truck"></i><h5>ምንም አቅራቢ የለም</h5></div>
    {% endif %}
</div>

<script>
document.getElementById('supplierSearch').addEventListener('input', function(){
    const q = this.value.toLowerCase().trim();
    document.querySelectorAll('#supplierList .contact-row').forEach(row=>{
        row.style.display = (row.getAttribute('data-search')||'').includes(q) ? '' : 'none';
    });
});
</script>
</body>
</html>
